name: assemble-v2-restore
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_restore/**"
      - ".github/workflows/assemble-v2-restore.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble real Vite bundles
        run: |
          set -euo pipefail
          ls -la assets/_restore/css/ assets/_restore/js/ assets/_restore/data/ || true
          cat assets/_restore/css/* > assets/index-BSI9EAX6.css
          cat assets/_restore/js/* > assets/index-B62bK7Wg.js
          echo "85d77b82dda9f5771db744ee12008982  assets/index-BSI9EAX6.css" | md5sum -c -
          echo "ff52f760c79bb8b21f2c3d52fdd2ebd2  assets/index-B62bK7Wg.js" | md5sum -c -
          if [ -d assets/_restore/data ]; then
            cat assets/_restore/data/* > data/index.json
            echo "6ad5c7e8f5c65b0f1ef4f72b321b9e4a  data/index.json" | md5sum -c -
          fi
          rm -rf assets/_restore assets/_restore_ping.txt
      - name: Commit assembled bundles
        run: |
          set -euo pipefail
          git config user.name "ramkandimalla"
          git config user.email "37137053+ramkandimalla94@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix: assemble real Vite JS/CSS/data from restore parts (d43cd66)"
          git push
