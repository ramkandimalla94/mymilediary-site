name: assemble-v2-restore
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_restore/READY"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real Vite bundles from private restore-staging
        run: |
          set -euo pipefail
          test -f assets/_restore/READY
          curl -fsSL -o assets/index-BSI9EAX6.css 'https://raw.githubusercontent.com/ramkandimalla94/mymilediary/bee8ee4f0ced31396ba67917643131d989ad28dc/.restore-staging/assets-index-BSI9EAX6.css?token=AI3KVHL5APEDABUQDWHVARDKXNU7JAA'
          curl -fsSL -o assets/index-B62bK7Wg.js 'https://raw.githubusercontent.com/ramkandimalla94/mymilediary/bee8ee4f0ced31396ba67917643131d989ad28dc/.restore-staging/assets-index-B62bK7Wg.js?token=AI3KVHLWCWTGZV5PJ7ZP4N3KXNU7JAA'
          mkdir -p data
          curl -fsSL -o data/index.json 'https://raw.githubusercontent.com/ramkandimalla94/mymilediary/bee8ee4f0ced31396ba67917643131d989ad28dc/.restore-staging/data-index.json?token=AI3KVHJJLQSDGQHK2HAACGDKXNU7JAA'
          echo "85d77b82dda9f5771db744ee12008982  assets/index-BSI9EAX6.css" | md5sum -c -
          echo "ff52f760c79bb8b21f2c3d52fdd2ebd2  assets/index-B62bK7Wg.js" | md5sum -c -
          echo "6ad5c7e8f5c65b0f1ef4f72b321b9e4a  data/index.json" | md5sum -c -
          grep -q 'body.booth' assets/index-BSI9EAX6.css
          grep -qE 'softRetryGoogle3D|google-2d-fallback|Map3D' assets/index-B62bK7Wg.js
          rm -rf assets/_restore assets/_restore_ping.txt _deploy_probe2.txt _deploy_probe.txt 2>/dev/null || true
      - name: Commit assembled bundles
        run: |
          set -euo pipefail
          git config user.name "ramkandimalla"
          git config user.email "37137053+ramkandimalla94@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix: restore real Vite JS/CSS/data monoliths from staging (d43cd66)"
          git push
